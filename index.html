<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pass Forge</title>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --fg: #e2e8f0; --accent: #38bdf8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; padding: 16px; }
    main { background: var(--card); padding: 24px; border-radius: 12px; width: 100%; max-width: 420px; }
    h1 { margin-top: 0; font-size: 1.4rem; }
    output { display: block; font-family: ui-monospace, monospace; font-size: 1.1rem; background: var(--bg); padding: 12px; border-radius: 8px; word-break: break-all; min-height: 2.8em; }
    label { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
    input[type=range] { flex: 1; }
    button { background: var(--accent); color: var(--bg); border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; cursor: pointer; margin-top: 12px; margin-right: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>🔐 Pass Forge</h1>
    <output id="result"></output>
    <label>Longitud <input type="range" id="length" min="8" max="64" value="16"> <span id="lengthValue">16</span></label>
    <label><input type="checkbox" id="upper" checked> Mayúsculas</label>
    <label><input type="checkbox" id="lower" checked> Minúsculas</label>
    <label><input type="checkbox" id="digits" checked> Números</label>
    <label><input type="checkbox" id="symbols" checked> Símbolos</label>
    <button id="generate">Generar</button>
    <button id="copy">Copiar</button>
  </main>
  <script>
    const SETS = {
      upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      lower: 'abcdefghijklmnopqrstuvwxyz',
      digits: '0123456789',
      symbols: '!@#$%^&*()-_=+[]{};:,.?'
    };
    const $ = (id) => document.getElementById(id);

    // Rejection sampling: descarta valores por encima del mayor múltiplo de n para evitar sesgo de módulo
    function randomIndex(n) {
      const limit = Math.floor(2 ** 32 / n) * n;
      const buf = new Uint32Array(1);
      do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
      return buf[0] % n;
    }

    function generate() {
      const chars = Object.keys(SETS).filter((k) => $(k).checked).map((k) => SETS[k]).join('');
      if (!chars) { $('result').textContent = 'Elige al menos un tipo de carácter'; return; }
      const length = +$('length').value;
      $('result').textContent = Array.from({ length }, () => chars[randomIndex(chars.length)]).join('');
    }

    $('length').addEventListener('input', (e) => { $('lengthValue').textContent = e.target.value; generate(); });
    document.querySelectorAll('input[type=checkbox]').forEach((el) => el.addEventListener('change', generate));
    $('generate').addEventListener('click', generate);
    $('copy').addEventListener('click', async () => {
      await navigator.clipboard.writeText($('result').textContent);
      $('copy').textContent = 'Copiado ✓';
      setTimeout(() => { $('copy').textContent = 'Copiar'; }, 1500);
    });
    generate();
  </script>
</body>
</html>
